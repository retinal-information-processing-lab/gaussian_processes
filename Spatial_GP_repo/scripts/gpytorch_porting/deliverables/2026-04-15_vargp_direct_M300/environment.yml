# Inference environment for the bundled M=300 vargp_direct checkpoints.
#
# Usage:
#   conda env create -f environment.yml        # create from scratch
#   conda env update -f environment.yml        # update existing env
#
# PyTorch: install torch first with the CUDA build that matches your GPU
# (e.g. cu121 for x86_64 + CUDA 12.1). Example:
#   pip install "torch>=2.5,<2.7" --extra-index-url https://download.pytorch.org/whl/cu121
# Then run `conda env update -f environment.yml` to pick up the rest. If torch
# is already installed inside the env, pip will skip it below.

name: gp_neural
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - numpy
  - scipy
  - matplotlib
  - pyyaml
  - pip
  - pip:
    - torch>=2.5,<2.7
    - gpytorch>=1.14,<1.16
    - linear-operator>=0.5,<0.7
