# Smoke Test — 64x64
#
# Minimal matrix to validate the full experiment pipeline before launching
# the massive all-cells run. Tests edge cells, both M values, both modes.
# n_iterations=3 (just enough for one full E/F/M cycle).
#
# Usage:
#   python create_experiment.py --name smoke_64 --config configs/smoke_test_64.yaml --desc "Smoke test 64x64"
#   python run_experiment.py --exp smoke_64

# ===== EXPERIMENT MATRIX =====
experiment:
  modes: [vargp_direct, default_gpy]
  inducing_points: [300, 2910]
  n_train: [2910]
  seeds: [1]
  cells: [0, 40]
  n_iterations: 3              # just enough to test full E/F/M cycle

# ===== All sections below identical to massive_allcells / canonical =====

kernel:
  type: arc_cosine
  sigma_0: 1.0
  Amp: 1.0
  beta: 0.1
  rho: 0.1
  eps_0x: null
  eps_0y: null
  gradient_mode: autograd
  use_mask: true
  bound_rf_center: true
  n_sigma_rf_bounds: 3.0
  lengthscale: 100.0

kernel_bounds:
  mask_threshold: 0.001
  Amp_max: 1000.0
  beta_min: 0.01
  beta_max: 1.0
  rho_min: 0.01
  rho_max: 0.5
  eps_min: -1.0
  eps_max: 1.0

likelihood:
  A_init: 0.01
  lambda0_init: 1.0

training:
  n_estep: 10
  n_fstep: 10
  n_mstep: 20
  lr: 0.1
  optimizer: lbfgs

optimizer:
  lbfgs_tolerance_change: 1.0e-9
  lbfgs_tolerance_grad: 1.0e-7
  lbfgs_history_size: 100
  lbfgs_line_search: strong_wolfe
  gpy_lbfgs_max_iter: 20

early_stopping:
  enabled: true
  patience: 15
  min_delta_rel: 0.001
  min_iterations: 10
  restore_best: true

numerical:
  jitter: 1.0e-4
  cholesky_max_tries: 3
  eigval_tol: 1.0e-4
  lambda_var_clamp: 1.0e-6
  f_mean_max_threshold: 500
  f_mean_mean_threshold: 100
  dtype: float32
  device: cuda

inducing:
  selection_method: pivoted
  n_candidates: null
  n_samples_sta: null

utility:
  n_mc_samples: 200
  r_max: 100
  adaptive_r_max: false
  adaptive_safety_k: 3.0
  adaptive_max_rmax: 10000
  adaptive_min_rmax: 200
  f_max: 100.0

data:
  path: "datasets/PNAS_64x64_center_crop_no_renorm.npz"
  n_px_side: null
  use_cache: true
